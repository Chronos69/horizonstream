name: Build Quest APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/quest-apk.yml

permissions:
  contents: read

concurrency:
  group: quest-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch Android native dependencies
        run: |
          git submodule update --init --depth 1 \
            third-party/nanopb third-party/jerasure \
            third-party/gf-complete third-party/curl

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install native build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential perl pkg-config python3 python3-protobuf \
            protobuf-compiler unzip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager \
            'platforms;android-34' 'build-tools;36.0.0' \
            'ndk;28.2.13676358' 'cmake;3.22.1' 'platform-tools'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties

      - name: Build signed debug APK
        working-directory: android
        run: |
          set -o pipefail
          bash ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-quest.log

      - name: Verify APK signature and contents
        run: |
          mkdir -p quest-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            quest-artifacts/HorizonStream-Quest3-debug.apk
          APK=quest-artifacts/HorizonStream-Quest3-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > quest-artifacts/apk-info.txt
          grep -F "package: name='com.cmsoft.horizonstream'" quest-artifacts/apk-info.txt
          unzip -Z1 "$APK" | grep '^lib/' > quest-artifacts/native-libraries.txt
          grep -Fx 'lib/arm64-v8a/libchiaki-jni.so' quest-artifacts/native-libraries.txt
          if grep -Ev '^lib/arm64-v8a/' quest-artifacts/native-libraries.txt; then
            echo 'Unexpected native architecture in APK' >&2
            exit 1
          fi
          cd quest-artifacts
          sha256sum HorizonStream-Quest3-debug.apk > SHA256SUMS.txt

      - name: Upload Quest APK
        uses: actions/upload-artifact@v4
        with:
          name: HorizonStream-Quest3-debug
          path: quest-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Quest-build-log
          path: android/build-quest.log
          if-no-files-found: ignore
          retention-days: 7
